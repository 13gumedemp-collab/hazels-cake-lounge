<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f7f4ee;color:#302d27;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f4ee">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fffdfa;border:1px solid #e8e0d3;border-radius:16px">
            <tr>
              <td style="padding:32px;text-align:center">
                <p style="margin:0;color:#a28349;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase">Hazel's Cake Lounge</p>
                <h1 style="margin:22px 0 10px;color:#302d27;font-family:Georgia,serif;font-size:26px;font-weight:500">Confirm your email</h1>
                <p style="margin:0;color:#756c5f;font-size:15px;line-height:1.6">Enter this code on the Your Account page:</p>
                <p style="margin:24px 0;padding:18px;border:1px solid #d8c293;border-radius:12px;background:#fffaf0;color:#5a4931;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
                <p style="margin:0;color:#8b8174;font-size:13px;line-height:1.6">The code expires shortly and can only be used once. If you did not create this account, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
